name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows PowerShell 5.1 and cursor tests
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Verify PowerShell and distribution configuration
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\verify.ps1

      - name: Verify cursor extension logic
        run: node --test .\tests\cursor-extension.test.mjs

      - name: Verify cursor package generation
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\verify-cursor-package.ps1

      - name: Check whitespace in working tree and submitted changes
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:DIFF_BASE -and $env:DIFF_BASE -ne ('0' * 40)) {
            if ($env:DIFF_BASE -notmatch '^[0-9a-f]{40}$') { throw 'Invalid base commit SHA.' }
            git diff --check $env:DIFF_BASE HEAD
          } else {
            git show --check --format= HEAD
          }
